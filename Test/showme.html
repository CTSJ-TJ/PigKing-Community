<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>查看帖子</title>
  <link rel="stylesheet" href="css/navigation bar.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div class="导航栏">
  <div class="left-logo">
    <div class="logo"><img src="img/系统图标.png" width="45"></div>
    <p>论坛管理信息系统</p>
  </div>
  <div class="占位"></div>
  <div class="right-function">
    <a href="list.html">主页</a>
    <a href="editor.html">写帖子</a>
    <a href="login.html" target="_blank">注销</a>
  </div>
</div>

<div class="blog-view-container">
  <div class="title" id="post-title"></div>
  <div id="post-content" class="内容"></div>
  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="editor.md/lib/marked.min.js"></script>
</div>

<script>
  // 假设这是从编辑器获取的标题和内容
  var title = '这是标题';
  var postContent = '# 这是内容\n\n这是一段普通的文本。';

  // 使用 marked.js 将 Markdown 转换为 HTML
  var htmlContent = marked(postContent);

  // 将标题和内容显示在页面上
  document.getElementById('post-title').innerText = title;
  document.getElementById('post-content').innerHTML = htmlContent;
</script>
</body>
</html>
