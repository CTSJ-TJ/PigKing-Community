<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加电影</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
	<link rel="stylesheet" type="text/css" href="../layui/css/layui.css" media="all">
	<style>
		body {
			/* 初始化 取消内外边距 */
			margin: 0;
			padding: 0;
			/* 渐变背景 */
			background: linear-gradient(125deg,#2c3e50,#27ae60,#2980b9,#e74c3c,#8e44ad);
			/* 指定背景图像的大小 */
			background-size: 500%;
			/* 执行动画：动画名 时长 线性的 无限次播放 */
			animation: bgAnimation 15s linear infinite;
		}
		#app {
			text-align: center;
			max-width: 100%;
			margin: 0 auto;
			padding: 20px;
			background-color: transparent; /* 修改背景颜色为透明 */
			box-shadow: 0 0 10px rgba(0,0,0,0.1);
		}

		/* 定义动画 */
		@keyframes bgAnimation {
			0%{
				background-position: 0% 50%;
			}
			50%{
				background-position: 100% 50%;
			}
			100%{
				background-position: 0% 50%;
			}
		}
		.post-list{
			list-style-type: none;
			font-size: 30px;
		}
		.post-item{
			background-color: #fff;
			margin-left: 8%;
			margin-right: 8%;
			padding-top: 35px;
			height: 120px;
			margin-top: 20px;
			border: 1px #fff solid;
			border-radius: 2px;
			/* 添加阴影 */
			box-shadow: 0 0 10px rgba(0,0,0,0.5);
		}
		.post-title {
			font-size: 36px;
			font-family: 华文新魏;
			margin-top: -20px;
			font-weight: bold;
			/*border: red 2px solid;*/
			text-align: center;
			color: #333;
		}
		.post-content {
			font-size: 18px;
			color: #666;
			height: 50px;
			overflow: hidden;
			text-overflow: ellipsis;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
		}
		.post-info{
			font-size: 14px;
			color: #666;
			display: flex;
			justify-content: space-between;
			align-items: flex-end;
		}
		.post-info span {
			margin: 15px;
		}
		.centered {
			display: flex;
			justify-content: center;
			align-items: center;
		}
		input {
			width: 200px;
			height: 30px;
			padding: 5px;
			font-size: 16px;
			border: 1px solid #ccc;
			border-radius: 5px;
		}
		button {
			height: 39px;
			margin-left: 10px;
			padding: 5px 15px;
			font-size: 14px;
			color: #fff;
			background-color: #007BFF;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}
		button:hover {
			background-color: #0056b3;
		}
	</style>
</head>
<script src="../js/vue.js"></script>
<script src="../element-ui/lib/index.js"></script>
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
	<template>
		<div class="centered">
			<input type="text" v-model="searchText" @keyup.enter="showAlert" placeholder="请输入搜索内容..." />
			<button @click="showAlert">搜索</button>
		</div>
		<ul class="post-list" v-infinite-scroll="load" style="overflow:auto">
			<li v-for="i in count" class="post-item" @click="find(i)">
				<div class="post-title">{{ title[i-1]}}</div>
				<div class="post-content">&nbsp;&nbsp;&nbsp;&nbsp;{{passege[i-1]}}</div>
				<div class="post-info">
					<span>时间: 2024-08-09</span>
					<span>状态: 未审核</span>
					<span>作者: 伟哥</span>
				</div>
			</li>
		</ul>
	</template>
</div>
</body>
<script>
	new Vue({
		el: '#app',
		data() {
			return {
				count: 0,
				title:[],
				passege:[],
				id:[],
				searchText: ''
			}
		},
		methods: {
			find(i){
				let ids=this.id[i-1]
				document.location.href="Showtime.html";
				localStorage.setItem('postid', ids);
			},
			finaAll(){
				axios.get("../post/findall").then(response=>{
					for (let post of response.data) {
						this.title.push(post.posttitle);
						this.passege.push(post.postpassege);
						this.id.push(post.postid);
					}
					this.count=this.title.length;
				});
			},
			showAlert() {
				alert('你搜索的内容是: ' + this.searchText);
			}
		},
		mounted(){
			this.finaAll();
		}
	});
</script>
</body>
</html>
