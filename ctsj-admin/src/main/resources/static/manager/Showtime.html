<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>查看帖子</title>
  <script src="../js/vue.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .blog-view-container {
      max-width: 90%;
      margin: 0 auto;
      margin-top: 50px;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .title {
      margin-top: 15px;
      font-size: 2em;
      color: #333;
      margin-bottom: 20px;
    }
    .contents {
      font-size: 1em;
      color: #666;
    }
    .btn {
      margin-left: 10px;
      padding: 5px 10px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 18px;
    }
    .btn-approve {
      background-color: #4CAF50; /* Green */
      color: white;
    }
    .btn-reject {
      background-color: #f44336; /* Red */
      color: white;
    }
  </style>
</head>
<body>
<div id="app" class="blog-view-container">
  <div>
    <button @click="pass()" class="btn btn-approve">审核通过</button>
    <button @click="passover()" class="btn btn-reject">审核不通过</button>
  </div>
  <div class="title">{{ title }}</div>
  <div v-html="htmlContent" class="contents"></div>
</div>
<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../editor.md/lib/marked.min.js"></script>
<script src="../js/axios-0.18.0.js"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      title: '这是标题',
      postContent: '# 这是内容\n\n这是一段普通的文本。'
    },
    computed: {
      htmlContent: function () {
        return marked(this.postContent);
      }
    },
    methods:{
      findId(){
        let data = localStorage.getItem('postid');
        // alert("show:"+data);
        // 请求：127.0.0.1:8888/post/findId?postid=5
        axios.post("../post/findId?postid="+data).then(response=>{
             console.log(response.data)
          this.title=response.data.posttitle;
          this.postContent=response.data.postpassege;
        });
      },
      pass(){
        alert("通过！！");
      },
      passover(){
        alert("不通过!!!");
      }
    },
    mounted(){
      this.findId();
    }
  });
</script>
</body>
</html>
