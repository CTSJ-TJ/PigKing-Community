<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>layout 管理系统大布局 - Layui</title>
  <link rel="stylesheet" href="../layui/css/layui.css">
</head>

<style>


</style>
<body>
<div class="layui-layout layui-layout-admin">
  <div class="layui-header">
    <div class="layui-logo layui-hide-xs layui-bg-black" onclick="changePage('Welcome')">CTSJ社区管理平台</div>
    <!-- 头部区域（可配合layui 已有的水平导航） -->
    <ul class="layui-nav layui-layout-left">
      <!-- 移动端显示 -->
      <li class="layui-nav-item layui-show-xs-inline-block layui-hide-sm" lay-header-event="menuLeft">
        <i class="layui-icon layui-icon-spread-left"></i>
      </li>
    </ul>
    <ul class="layui-nav layui-layout-right">
      <li class="layui-nav-item layui-hide layui-show-md-inline-block">
        <a href="javascript:;">
<!--          <img src="../images/1.jpg" class="layui-nav-img">-->
          欢迎您！尊敬的:&nbsp;&nbsp;
          <span>初唐四杰</span>
        </a>
        <dl class="layui-nav-child">
          <dd><a href="">修改密码</a></dd>
          <dd><a href="">退出系统</a></dd>
        </dl>
      </li>
      <li class="layui-nav-item" lay-header-event="menuRight" lay-unselect>
        <a href="javascript:;">
          <i class="layui-icon layui-icon-more-vertical"></i>
        </a>
      </li>
    </ul>
  </div>
  
  <div class="layui-side layui-bg-black">
    <div class="layui-side-scroll">
      <!-- 左侧导航区域（可配合layui已有的垂直导航） -->
      <ul class="layui-nav layui-nav-tree" lay-filter="test">
        <li class="layui-nav-item layui-nav-itemed">
          <a class="" href="javascript:;" onclick="changePage('Posts')">创作审核</a>
        </li>
        <li class="layui-nav-item">
          <a href="javascript:;"onclick="changePage('select')">用户管理</a>
        </li>
        <li class="layui-nav-item">
          <a href="javascript:;"onclick="changePage('admin')">管理员管理</a>
        </li>
		<li class="layui-nav-item">
		  <a href="javascript:;"onclick="changePage('Testadmin')">个人设置</a>
		</li>
        <li class="layui-nav-item"><a href="javascript:void(0);" onclick="changePage('supermarket')">统计报表</a></li>
      </ul>
    </div>
  </div>
  
  <div class="layui-body">
    <!-- 内容主体区域 -->
    <iframe src="welcome.html" frameborder="0" id="demoAdmin" style="width: 100%;height: 100%;"></iframe>
  </div>
  
  <div class="layui-footer">
    <!-- 底部固定区域 -->
    <p style="text-align: center;">版权所有：CTSJ社区开发者</p>
  </div>
</div>
<script src="../layui/layui.js"></script>
<script>
//JS
layui.use(['element', 'layer', 'util'], function(){
  var element = layui.element
  ,layer = layui.layer
  ,util = layui.util
  ,$ = layui.$;

  //头部事件
  util.event('lay-header-event', {
    //左侧菜单事件
    menuLeft: function(othis){
      layer.msg('展开左侧菜单的操作', {icon: 0});
    }
    ,menuRight: function(){
      layer.open({
        type: 1
        ,content: '<div style="padding: 15px;">处理右侧面板的操作</div>'
        ,area: ['260px', '100%']
        ,offset: 'rt' //右上角
        ,anim: 5
        ,shadeClose: true
      });
    }
  });

});

function changePage(page){
	document.getElementById("demoAdmin").src=page+".html";
}
</script>
</body>
</html>
