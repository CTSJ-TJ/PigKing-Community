<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <title>CTSJ资源社区</title>
    <!--这里引入页面的样式-->
    <style>
        #app{
            border: 2px red solid;
        }
        .infinite-list{
            list-style-type: none;
            font-size: 30px;
        }
        .infinite-list-item{
            background-color: gainsboro;
            margin-left: 8%;
            margin-right: 8%;
            padding-top: 35px;
            height: 100px;
            margin-top: 20px;
            border: 1px blue solid;
        }
    </style>
</head>
<!--引入相关的文件-->
<script src="../js/vue.js"></script>
<script src="../element-ui/lib/index.js"></script>
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
<script src="../js/axios-0.18.0.js"></script>

<body>
        <div id="app">
            <template>
                <ul class="infinite-list" v-infinite-scroll="load" style="overflow:auto">
                    <li v-for="i in count" class="infinite-list-item" @click="find(i)">
                        学习{{ i }}:{{text[i-1]}}
                    </li>
                </ul>
            </template>
        </div>
</body>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                count: 0,
                text:[0,'So',2,3,4,5,6,7,8,9,10]
            }
        },
        methods: {
            load () {
                if(this.count<10) {
                    this.count += 1
                }
            },
            find(i){
                alert("学习"+i)
                document.location.href="Testmain.html"
            }
        },
        mounted(){

        }
    });
</script>
</html>
