<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>CTSJ的资源社区</title>
		<link rel="icon" type="image/png" href="../image/mylog.jpg">
		<!--页面样式-->
		<style>
	
		iframe{
			width: 100%;
			height: 100%;
		}
		#mytitle{
			font-family: 华文新魏;
			color: goldenrod;
			border: green 1px solid;
			border-radius: 10px;
			box-shadow: 0 0 5px rgba(0, 0, 0, 0.3); /* 添加阴影效果 */
		}
		
		</style>
	</head>

	<!--引入相关的文件-->
	<script src="../js/vue.js"></script>
	<script src="../element-ui/lib/index.js"></script>
	<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
	<script src="../js/axios-0.18.0.js"></script>

	<body>
		
		<!--html主体部分-->
		<div id="app">
			<el-container style="height: 850px; border: 1px solid #eee">
				<el-header id="mytitle" style="background-color:rgb(238, 241, 246) ; text-align: left; font-size: 36px; line-height: 90px; height: 100px;">
					<img src="../image/dong01.gif" style="width: 100px; float: left;" />
					<span style="margin-left:10%;color: firebrick;">欢迎来到CTSJ的资源社区</span>
					<span style="float: right;font-size: 24px;">
						<el-avatar> CTSJ </el-avatar> 初唐四杰
						<button style="margin-right: 0px">登录/注册</button>
					</span> 
				</el-header>
				<el-container>
					<el-aside width="200px" style="background-color: rgb(238, 241, 246)">
						<el-menu :default-openeds="['2','3']">
							<el-menu-item index="1" @click="changePages(1)"><i class="el-icon-coin"></i>社区资源</el-menu-item>
							<el-submenu index="2">
							<template slot="title"><i class="el-icon-goods"></i>编程学习</template>
								<el-menu-item index="2-1" @click="changePages(2)">Java开发</el-menu-item>
								<el-menu-item index="2-2" @click="changePages(3)">Python基础</el-menu-item>
								<el-menu-item index="2-3" @click="changePages(4)">C/C++学习</el-menu-item>
							</el-submenu>
							<el-submenu index="3">
							<template slot="title"><i class="el-icon-document-copy"></i>理论学习</template>
								<el-menu-item index="3-1" @click="changePages(5)">面试必答</el-menu-item>
								<el-menu-item index="3-2" @click="changePages(6)">强化训练</el-menu-item>
							</el-submenu>
							<el-submenu index="4">
								<template slot="title"><i class="el-icon-document-copy"></i>四级宝典</template>
								<el-menu-item index="3-1" @click="changePages(7)">新增单词</el-menu-item>
								<el-menu-item index="3-2" @click="changePages(11)">单词翻译</el-menu-item>
							</el-submenu>
							<el-submenu index="5">
								<template slot="title"><i class="el-icon-document-copy"></i>休闲娱乐</template>
								<el-menu-item index="3-1" @click="changePages(8)">小说阅读</el-menu-item>
								<el-menu-item index="3-2" @click="changePages(9)">社区影院</el-menu-item>
							</el-submenu>
							<el-menu-item index="6" @click="changePages(10)"><i class="el-icon-user"></i>关于社区</el-menu-item>
						</el-menu>
					</el-aside>
					<el-main> <iframe :src="mainsrc"></iframe> </el-main>
				</el-container>
			</el-container>
		</div>
		
		<!--要使用vue的js代码-->
		<script>
			new Vue({
				el: '#app',
				data:{
					mainsrc:'Welcome.html'
				},
				methods: {
					changePages:function(i){
						if(i == 1){
							this.mainsrc = "MySource.html"
						} else if(i == 2){
							this.mainsrc = "Study02.html"
						} else if(i == 3){
							this.mainsrc = "Study03.html"
						} else if(i == 4){
							this.mainsrc = "Study04.html"
						} else if(i == 5){
							this.mainsrc = "Study05.html"
						} else if(i == 6){
							this.mainsrc = "Study06.html"
						} else if(i == 7){
							this.mainsrc = "Study07.html"
						} else if(i == 8){
							this.mainsrc = "Study08.html"
						}else if(i==9){
							this.mainsrc = "Study09.html"
						}else if(i==10){
							this.mainsrc = "Study10.html"
						}else if(i==11){
							this.mainsrc = "Study11.html"
						}
					}
				},
				mounted(){

				}
			});
		</script>
		
	</body>
</html>
