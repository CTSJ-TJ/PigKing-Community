<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>写帖子</title>
    <link rel="stylesheet" href="../css/navigation bar.css">
    <link rel="stylesheet" href="../css/editor.css">
</head>
<body>
<div class="blog-edit-container">
    <div class="title">
        <input type="text" placeholder="在这里写下主贴标题" id="title">
        <button id="submit" onclick="addpost()">发布帖子</button>
    </div>
    <div id="editor" class="编辑器"></div>
    <link rel="stylesheet" href="../editor.md/css/editormd.min.css" />
    <script src="../js/jquery-3.4.1.min.js"></script>
    <script src="../editor.md/lib/marked.min.js"></script>
    <script src="../editor.md/lib/prettify.min.js"></script>
    <script src="../editor.md/editormd.js"></script>
</div>
<script src="../js/axios-0.18.0.js"></script>
<script>
    var content = '# 在这里写下一篇帖子 ##';
    var config = {
        // 这里的尺寸必须在这里设置. 设置样式会被 editormd 自动覆盖掉.
        width: "100%",
        // 高度 100% 意思是和父元素一样高. 要在父元素的基础上去掉标题编辑区的高度
        height: "100vh",
        // 编辑器中的初始内容
        markdown: content,
        // 指定 editor.md 依赖的插件路径
        path: "../editor.md/lib/"
    };
    var editor = editormd("editor", config);
    
    function addpost(){
        var title = document.getElementById('title').value;
        var postContent = editor.getMarkdown(); // 获取 Markdown
        console.log('标题: ', title);
        console.log('内容: ', postContent);
        axios.get("../post/addpost",{
            params: {
                posttitle: title,
                postpassege: postContent
            }
        }).then(response=>{
            console.log("无语："+response.data);
            if (response.data>0) {
                document.location.href = "WaitPass.html";
            }
            else {
                alert("发布失败");
                document.location.href = "Testmain.html";
            }
        });
    }

</script>
</body>
</html>
