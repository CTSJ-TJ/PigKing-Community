<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #app{
      /*border: 2px red solid;*/
    }
    #inputBox {
      margin-left: 10%;
      width: 80%;
      height: 200px;
      border: 1px solid #000;
      padding: 10px;
      overflow-y: scroll;
      margin-bottom: 10px;
    }
    #submitButton {
      margin-left: 80%;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      width: 100px;
    }
    #submitButton:hover {
      background-color: #45a049;
    }
    #gauge{
      width:50%;
      height:500px;
      margin: 0 auto;  /* 添加这一行 */
    }
  </style>
</head>
<script src="../js/vue.js"></script>
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
  <div id="title">
    <h1 style="font-family: 微软雅黑;color: #1A8BE8">情感分析</h1>
    <h3 style="margin-left: 10%">请输入一段中文文本：</h3>
  </div>
  <div id="inputBox" contenteditable="true" @input="updateContent"></div>
  <button id="submitButton" @click="submit">情感分析</button>
  <div id="gauge"></div> <!-- 添加这一行 -->
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5"></script> <!-- 添加这一行 -->
<script>
  new Vue({
    el: '#app',
    data() {
      return {
        inputContent: '',
        gauge: null  // 添加这一行
      }
    },
    mounted() {  // 添加这个方法
      this.gauge = echarts.init(document.getElementById('gauge'));  // 添加这一行
      var option = {
        series: [{
          type: 'gauge',
          startAngle: 180,
          endAngle: 0,
          min: -1,
          max: 1,
          splitNumber: 2,
          axisLine: {
            lineStyle: {
              width: 2
            }
          },
          pointer: {
            itemStyle: {
              color: 'auto'
            }
          },
          detail: {
            valueAnimation: true,
            formatter: '{value}'
          },
          data: [{
            value: 0
          }]
        }]
      };
      this.gauge.setOption(option);
    },
    methods: {
      updateContent(e) {
        this.inputContent = e.target.innerText;
      },
      submit() {
        // alert(this.inputContent);
        axios.get("../emotion",{
          params:{texts: this.inputContent}
        }).then(response=>{
           // alert(JSON.stringify(response.data));
          var numbers = response.data;
          this.gauge.setOption({
            series: [{
              data: [{value: numbers}]  // 使用 numbers 变量更新仪表盘的值
            }]
          });
        });
      }
    }
  });
</script>
</body>
</html>
