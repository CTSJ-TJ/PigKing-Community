<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>24°超市会员</title>
    <!--这里引入页面的样式-->
    <style>

    </style>
</head>
<!--引入相关的文件-->
<script src="../js/vue.js"></script>
<script src="../element-ui/lib/index.js"></script>
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
    <h1>重要消息：伟哥去面试了，请给他加油打气！！</h1>

</div>


<script>
    const urlParams = new URLSearchParams(window.location.search);
    const uname=urlParams.get('userName');
    // 创建一个vue的实例对象,里面写那些数据和方法(一个是页面加载完后自动执行的方法，一个是其他操作后执行的代码)
    // 创建 Vue 实例
    new Vue({
        el: '#app',
        data() {
            return {
                value: new Date(),
                a:{}
            }
        },
        methods: {
            goBack() {
                console.log('go back');
                history.go(-1); // 返回上一个页面
            },
            showMemberInfo(){
                axios.get("../users?op=showMemberInfo&userName="+uname).then(response=>{
                    //console.log(response.data.data[0].userId+"++++++++++++++++++++++");
                   this.a= response.data.data[0]
                })
            }
        },
        mounted(){
            this.showMemberInfo();
        }
    });
</script>
</body>
</html>
