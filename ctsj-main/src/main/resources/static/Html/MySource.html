<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CTSJ资源社区</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        #app{
            /*border: 2px red solid;*/
            background-image: url("../image/dongtu01.gif");
            /*background-size: cover;*/
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            background-color: gainsboro;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .post-list{
            list-style-type: none;
            font-size: 30px;
        }
        .post-item{
            background-color: #fff;
            margin-left: 8%;
            margin-right: 8%;
            padding-top: 35px;
            height: 120px;
            margin-top: 20px;
            border: 1px #fff solid;
            border-radius: 2px;
            /* 添加阴影 */
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .post-title {
            font-size: 36px;
            font-family: 华文新魏;
            margin-top: -20px;
            font-weight: bold;
            /*border: red 2px solid;*/
            text-align: center;
            color: #333;
        }
        .post-content {
            font-size: 18px;
            color: #666;
        }
        .centered {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        input {
            width: 200px;
            height: 30px;
            padding: 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            height: 39px;
            margin-left: 10px;
            padding: 5px 15px;
            font-size: 14px;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<script src="../js/vue.js"></script>
<script src="../element-ui/lib/index.js"></script>
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
    <template>
        <div class="centered">
            <input type="text" v-model="searchText" @keyup.enter="showAlert" placeholder="请输入搜索内容..." />
            <button @click="showAlert">搜索</button>
        </div>
        <ul class="post-list" v-infinite-scroll="load" style="overflow:auto">
            <li v-for="i in count" class="post-item" @click="find(i)">
                <div class="post-title">{{ title[i-1]}}</div>
                <div class="post-content">&nbsp;&nbsp;&nbsp;&nbsp;{{passege[i-1]}}</div>
            </li>
        </ul>
    </template>
</div>
</body>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                count: 0,
                title:[],
                passege:[],
                id:[],
                searchText: ''
            }
        },
        methods: {
            find(i){
                let ids=this.id[i-1]
                document.location.href="Showtime.html";
                localStorage.setItem('postid', ids);
            },
            finaAll(){
                axios.get("../post/findall").then(response=>{
                    for (let post of response.data) {
                       this.title.push(post.posttitle);
                        this.passege.push(post.postpassege);
                        this.id.push(post.postid);
                    }
                    this.count=this.title.length;
                });
            },
            showAlert() {
                alert('你搜索的内容是: ' + this.searchText);
            }
        },
        mounted(){
            this.finaAll();
        }
    });
</script>
</html>
