<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>查看帖子</title>
  <script src="../js/vue.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .blog-view-container {
      max-width: 90%;
      margin: 0 auto;
      margin-top: 50px;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    #bottom{
      max-width: 90%;
      margin: 0 auto;
      margin-top: 50px;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .title {
      font-size: 2em;
      color: #333;
      margin-bottom: 20px;
    }
    .content {
      font-size: 1em;
      color: #666;
    }

    .comment {
      margin-top: 10px;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .comment h3 {
      margin: 0;
      color: #333;
      font-size: 16px;
    }
    .comment p {
      margin: 5px 0;
    }
    .comment-input {
      margin-top: 20px;
    }
    .comment-input textarea {
      width: 100%;
      height: 100px;
      padding: 5px;
    }
    .comment-input button {
      margin-top: 10px;
      padding: 5px 10px;
    }
    #backButton {
      background-color: #f0f0f0; /* Green */
      border: none;
      color: black;
      padding: 10px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 20px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 12px;
      transition-duration: 0.4s; /* transition effect */
      margin-bottom: 20px;
    }
    #backButton:hover {
      background-color: white; /* White */
      color: black; /* Black text */
      border: 2px solid #4CAF50; /* Green border */
    }
  </style>
</head>
<script src="../js/jquery-3.4.1.min.js"></script>
<script src="../editor.md/lib/marked.min.js"></script>
<script src="../js/axios-0.18.0.js"></script>
<script src="../element-ui/lib/index.js"></script>   <!--引入组件库-->
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">  <!--引入样式库-->
<body>
<div id="app">
  <div class="blog-view-container">
    <button id="backButton" @click="goBack">返回</button>
    <div class="title">{{ title }}</div>
    <div v-html="htmlContent" class="content"></div>
    <ul class="bottoms" style="display: flex; justify-content: flex-end; list-style-type: none;">
      <li class="clikzhan" style="margin-right: 20px;">
        <a class="tool-click" style="display: flex; align-items: center;" @click="toggleImage">
          <img class="end" v-show="!showStart" src="../image/zhan02.png" alt="" style="width: 20px; height: 20px;">
          <img class="start" v-show="showStart" src="../image/zhan01.png" alt="" style="width: 20px; height: 20px;">
          <span id="clickcount"style="color: rgb(153, 154, 170); margin-left: 10px;">{{clicks}}</span>
        </a>
      </li>
      <li class="collect">
        <a class="tool-collect" style="display: flex; align-items: center;" @click="toggleImage1">
          <img class="end" v-show="!showStart1" src="../image/shou02.png" alt="" style="width: 20px; height: 20px;">
          <img class="start" v-show="showStart1" src="../image/shou01.png" alt="" style="width: 20px; height: 20px;">
          <span id="collectount"style="color: rgb(153, 154, 170); margin-left: 10px;">{{collects}}</span>
        </a>
      </li>
    </ul>
  </div>

  <div id="bottom">
    <div class="comment-input">
      <textarea v-model="newComment" placeholder="输入你的评论..."></textarea>
      <button @click="submitComment">提交评论</button>
    </div>
    <div class="comment" v-for="observe in observes" :key="observe.id">
      <h3>{{ observe.username }}</h3>
      <p>{{ observe.observeContent }}</p>
      <p>{{ observe.createDate }}</p>
    </div>
  </div>

</div>
<script>
  new Vue({
    el: '#app',
    data: {
      title: '这是标题',
      postContent: '# 这是内容\n\n这是一段普通的文本。',
      showStart: true,
      showStart1: true,
      clicks:20,
      collects:10,
      myid:[],
      postid:[],
      observes: [
              // {"id":1,"postid":2,"username":"伟哥", "lastId": null,"observeContent": "你好","createDate": "2020-05-13 12:01:24"},
              // {"id":2,"postid":2,"username":"伟哥", "lastId": 1,"observeContent": "你好","createDate": "2020-05-13 12:01:24"},
              // {"id":3,"postid":2,"username":"伟哥", "lastId": null,"observeContent": "你好","createDate": "2020-05-13 12:01:24"},
      ],
      newComment:''
    },
    computed: {
      htmlContent: function () {
        return marked(this.postContent);
      }
    },
    methods:{
      findId(){
        this.postid = localStorage.getItem('postid');
        this.myid=localStorage.getItem("myid");
        axios.post("../post/findId?postid="+this.postid).then(response=>{
             console.log(response.data)
          this.title=response.data.posttitle;
          this.postContent=response.data.postpassege;
          this.clicks=response.data.postlikes
          this.collects=response.data.collections;
          var path="../status/findstatus?userid="+this.myid+"&postid="+this.postid;
          axios.get(path).then(result=>{
             var code=result.data.code;
             if (code==1){
               this.showStart = !this.showStart;
             }else if(code==2){
               this.showStart1 = !this.showStart1;
             }else if(code==3){
               this.showStart = !this.showStart;
               this.showStart1 = !this.showStart1;
             }
          });

        });
      },
      toggleImage: function() {
        // this.showStart = !this.showStart;
        let math=0;
        if(!this.showStart){
          // this.clicks-=1;
          math=-1;
        }else{
          // this.clicks+=1;
          math=1;
        }
        let path="../status/modify?userid="+this.myid+"&postid="+this.postid+"&click="+math;
        axios.get(path).then(result=>{
          var a=result.data;
          if(a==-2){
            alert("操作过于频繁！！！");
          }else if(a==-1){
            alert("请求无效！！！");
          }else{
            let path1="../post/modify?postid="+this.postid+"&click="+math;
            axios.get(path1).then(rst=>{
              var a1=rst.data;
              if(a1<1){
                alert("数据出错了！！");
              }else {
                this.showStart = !this.showStart;
                if(math>0){
                  this.clicks+=1;
                }else {
                  this.clicks-=1;
                }
              }
            });
          }
        });

      },
      toggleImage1: function(){
        let math=0;
        this.showStart1 = !this.showStart1;
        if(this.showStart1){
          this.collects-=1;
          math=-1;
        }else{
          this.collects+=1;
          math=1;
        }
        let path="../status/modify?userid="+this.myid+"&postid="+this.postid+"&collect="+math;
        axios.get(path).then(result=>{
          var a=result.data;
          if(a==-2){
            alert("操作过于频繁！！！");
          }else if(a==-1){
            alert("请求无效！！！");
          }else{
            let path1="../post/modify?postid="+this.postid+"&collect="+math;
            axios.get(path1).then(rst=>{
              var a1=rst.data;
              if(a1<1){
                alert("数据出错了！！");
              }
            });
          }
        });
      },
      submitComment:function() {
       alert("点击了");
      },
      goBack:function (){
        document.location.href="MySource.html";
      }
    },
    mounted(){
      this.findId();
    }
  });

</script>
</body>
</html>
