<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #3498db, #9b59b6);
            overflow: hidden;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 0 50px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            position: relative;
            width: 200px;
            height: 200px;
            perspective: 1000px;
            margin-bottom: 100px;
        }
        .cube {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            animation: spin 6s infinite linear;
        }
        .cube div {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            text-align: center;
            line-height: 200px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }
        .front {
            transform: translateZ(100px);
        }
        .back {
            transform: rotateY(180deg) translateZ(100px);
        }
        .left {
            transform: rotateY(-90deg) translateZ(100px);
        }
        .right {
            transform: rotateY(90deg) translateZ(100px);
        }
        .top {
            transform: rotateX(90deg) translateZ(100px);
        }
        .bottom {
            transform: rotateX(-90deg) translateZ(100px);
        }
        @keyframes spin {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }
            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
        .button {
            display: inline-block;
            border-radius: 4px;
            background-color: #f4511e;
            border: none;
            color: #FFFFFF;
            text-align: center;
            font-size: 28px;
            padding: 20px;
            width: 200px;
            transition: all 0.5s;
            cursor: pointer;
            margin: 5px;
        }
        .button span {
            cursor: pointer;
            display: inline-block;
            position: relative;
            transition: 0.5s;
        }
        .button span:after {
            content: '»';
            position: absolute;
            opacity: 0;
            top: 0;
            right: -20px;
            transition: 0.5s;
        }
        .button:hover span {
            padding-right: 25px;
        }
        .button:hover span:after {
            opacity: 1;
            right: 0;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #3498db;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
<div class="header">等待审核中.....</div>
<div class="main-container">
    <div class="container">
        <div class="cube">
            <div class="front">等待审核</div>
            <div class="back">等待审核</div>
            <div class="left">等待审核</div>
            <div class="right">等待审核</div>
            <div class="top">等待审核</div>
            <div class="bottom">等待审核</div>
        </div>
    </div>
    <button class="button" onclick="backed()" style="vertical-align:middle"><span>返回 </span></button>
</div>
<script>
      function backed(){
          alert("返回！！");
          document.location.href='MySource.html';
      }

</script>

</body>
</html>
