<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>CTSJ的资源社区</title>
		<link rel="icon" type="image/png" href="../image/mylog.jpg">
		<!--页面样式-->
		<style>
	
		iframe{
			width: 100%;
			height: 100%;
		}
		#mytitle{
			font-family: 'Roboto', sans-serif; /* 使用Google字体 */
			color: #B8860B; /* 深金色 */
			border: 2px solid #696969; /* 深灰色边框 */
			border-radius: 5px; /* 减小边角的圆度 */
			box-shadow: 0 0 10px rgba(105, 105, 105, 0.5); /* 改变阴影颜色和大小 */
			transition: all 0.3s ease; /* 添加过渡效果 */
		}

		#mytitle:hover{
			color: red; /* 当鼠标悬停时改变颜色 */
			background-color: whitesmoke; /* 当鼠标悬停时改变背景颜色 */
		}
		
		</style>
	</head>

	<!--引入相关的文件-->
	<script src="../js/vue.js"></script>
	<script src="../element-ui/lib/index.js"></script>
	<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
	<script src="../js/axios-0.18.0.js"></script>

	<body>
		
		<!--html主体部分-->
		<div id="app">
			<el-container style="height: 850px; border: 1px solid #eee">
				<el-header id="mytitle" style="background-color:rgb(238, 241, 246); text-align: left; font-size: 36px; line-height: 90px; height: 100px;">
					<img src="../image/dong01.gif" style="width: 100px; float: left;" />
					<span style="margin-left:10%;color: firebrick;">欢迎来到CTSJ的资源社区</span>
					<span style="float: right;font-size: 24px;">
                    <el-avatar id="avatar"> CTSJ </el-avatar>
                    <span id="name" style="font-family: 华文新魏">{{username}}</span>
                    <button  id="myButton" @click="login()" style="margin-right: 0px; background-color: firebrick; color: white; border: none; padding: 10px 20px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; margin: 4px 2px; cursor: pointer; transition-duration: 0.4s;">登录/注册</button>
                    <button  id="myButton1" @click="exits()" style="margin-right: 0px; background-color: firebrick; color: white; border: none; padding: 10px 20px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; margin: 4px 2px; cursor: pointer; transition-duration: 0.4s;">退出登录</button>

					</span>
				</el-header>
				</el-header>
				<el-container>
					<el-aside width="200px" style="background-color: rgb(238, 241, 246)">
						<el-menu :default-openeds="['2','3']">
							<el-menu-item index="1" @click="changePages(1)"><i class="el-icon-coin"></i>社区论坛</el-menu-item>
							<el-submenu index="2">
							<template slot="title"><i class="el-icon-goods"></i>创作管理</template>
								<el-menu-item index="2-1" @click="changePages(2)">创建帖子</el-menu-item>
								<el-menu-item index="2-2" @click="changePages(3)">我的帖子</el-menu-item>
								<el-menu-item index="2-3" @click="changePages(4)">报表统计</el-menu-item>
							</el-submenu>
							<el-submenu index="3">
							<template slot="title"><i class="el-icon-document-copy"></i>社区交流</template>
								<el-menu-item index="3-1" @click="changePages(5)">消息</el-menu-item>
								<el-menu-item index="3-2" @click="changePages(6)">我的好友</el-menu-item>
							</el-submenu>
							<el-submenu index="4">
								<template slot="title"><i class="el-icon-document-copy"></i>社区AI</template>
								<el-menu-item index="3-1" @click="changePages(7)">新增单词</el-menu-item>
								<el-menu-item index="3-2" @click="changePages(11)">单词翻译</el-menu-item>
							</el-submenu>
							<el-submenu index="5">
								<template slot="title"><i class="el-icon-document-copy"></i>休闲娱乐</template>
								<el-menu-item index="3-1" @click="changePages(8)">小说阅读</el-menu-item>
								<el-menu-item index="3-2" @click="changePages(9)">社区影院</el-menu-item>
							</el-submenu>
							<el-menu-item index="6" @click="changePages(10)"><i class="el-icon-user"></i>关于社区</el-menu-item>
						</el-menu>
					</el-aside>
					<el-main> <iframe :src="mainsrc"></iframe> </el-main>
				</el-container>
			</el-container>
		</div>
		
		<!--要使用vue的js代码-->
		<script>
			new Vue({
				el: '#app',
				data:{
					mainsrc:'Welcome.html',
					username:'游客',
					userid:0
				},
				methods: {
					changePages:function(i){
						if(i == 1){
							this.mainsrc = "MySource.html"
						} else if(i == 2){
							this.mainsrc = "Editor.html"
						} else if(i == 3){
							this.mainsrc = "Study03.html"
						} else if(i == 4){
							this.mainsrc = "Study04.html"
						} else if(i == 5){
							this.mainsrc = "Message.html";
						} else if(i == 6){
							this.mainsrc = "Study06.html"
						} else if(i == 7){
							this.mainsrc = "Study07.html"
						} else if(i == 8){
							this.mainsrc = "Study08.html"
						}else if(i==9){
							this.mainsrc = "Study09.html"
						}else if(i==10){
							this.mainsrc = "Study10.html"
						}else if(i==11){
							this.mainsrc = "Study11.html"
						}
					},
					login:function(){
						document.location.href="../login.html";
					},
					exits:function (){
						document.location.href="../login.html";
					},
				},
				mounted(){
					axios.get("../user/getuser").then(result=>{
						// alert(JSON.stringify(result.data));
						this.username=result.data.myname;
						this.userid=result.data.myid;
						if(this.username!=null && this.userid !=null){
							document.getElementById('myButton').style.display = 'none';
							document.getElementById('myButton1').style.display = 'inline-block';
						}else {
							this.username="游客";
							document.getElementById('myButton1').style.display = 'none';
						}
					});
				}
			});
		</script>
		
	</body>
</html>
