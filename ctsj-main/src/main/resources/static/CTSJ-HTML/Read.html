<!DOCTYPE html>
<html>
<head>
  <title>阅读界面</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .container {
      max-width: 800px;
      /*margin: 0 auto;*/
      margin: 20px 30px 40px 50px;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 2em;
      color: #333;
    }
    p {
      line-height: 1.6;
      color: #666;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>文章标题</h1>
  <p>
    这里是文章的内容。
    你可以根据需要添加更多的文本，图片，链接等元素。
  </p>
</div>
</body>
</html>
