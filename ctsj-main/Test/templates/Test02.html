<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>获取信息窗口内容</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <script src="//api.map.baidu.com/api?type=webgl&v=2.0&ak=rXA8iQy9OhoIKkZEjWbO0xJR5c40gDcg"></script>
  <style>
    #Map{
      width: 90%;
      height: 600px;
      border: 2px red solid;
    }
  </style>
</head>

<body>
<input id="address" type="text" placeholder="输入地址">
<button onclick="setCenter()">设置中心点</button>
<input id="address1" type="text" placeholder="输入地址">
<button onclick="addCenter()">添加点1</button>
<div id="Map"></div>
</body>

</html>
<script>
  var map = new BMapGL.Map('Map');// 创建Map实例
  var point; // 初始化地图,设置中心点坐标和地图级别
  // 获取用户的当前位置
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      point = new BMapGL.Point(position.coords.longitude, position.coords.latitude);
      alert(position.coords.longitude+","+ position.coords.latitude)
      // 创建点坐标
      map.centerAndZoom(point, 17);//调节比列

      // 添加标注
      var marker = new BMapGL.Marker(point);
      map.addOverlay(marker);

      console.log('Marker added to map');
      var scaleCtrl = new BMapGL.ScaleControl();  // 添加比例尺控件
      map.addControl(scaleCtrl);
      var zoomCtrl = new BMapGL.ZoomControl();  // 添加缩放控件
      map.addControl(zoomCtrl);
    });
  } else {
    point = new BMapGL.Point(116.404, 39.915); // 默认的中心点坐标
    map.centerAndZoom(point, 20);
  }

  function setCenter() {
    var address = document.getElementById('address').value;
    var myGeo = new BMapGL.Geocoder();
    // 将地址解析结果显示在地图上，并调整地图视野
    myGeo.getPoint(address, function(point){
      if (point) {
        map.centerAndZoom(point, 16);
        map.addOverlay(new BMapGL.Marker(point));
      } else {
        alert("您选择地址没有解析到结果!");
      }
    });
  }

  function addCenter() {
    var address = document.getElementById('address1').value;
    var myGeo = new BMapGL.Geocoder();
    // 将地址解析结果显示在地图上，并调整地图视野
    myGeo.getPoint(address, function(point){
      if (point) {
        map.centerAndZoom(point, 19);
        map.addOverlay(new BMapGL.Marker(point));
      } else {
        alert("您选择地址没有解析到结果!");
      }
    });
  }

</script>
