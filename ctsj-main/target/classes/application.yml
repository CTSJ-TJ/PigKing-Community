eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8888

spring:
  application:
    name: ctsj-main
  main:
    web-application-type: reactive
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql:///my_community
    username: root
    password: 123456
  session:
    store-type: redis
    redis:
      host: localhost
      port: 6379
      password:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  cloud:
    gateway:
      routes:
        - id: route1
          uri: lb://ctsj-myai
          predicates:
            - Path=/myai/**
        - id: route2
          uri: lb://ctsj-amuse
          predicates:
            - Path=/status/**
        - id: route2
          uri: lb://ctsj-amuse
          predicates:
            - Path=/friend/**


# 映射文件位置
mybatis:
  mapper-locations:
        - classpath:mapper/*Mapper.xml
        - classpath:mybatis-config.xml
  configuration:
    map-underscore-to-camel-case: true #驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.mybatis: DEBUG


---
server:
  port: 9009
spring:
  profiles: user1









