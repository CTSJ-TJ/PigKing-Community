<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>24°超市会员</title>
    <!--这里引入页面的样式-->
    <style>
        #app{
            margin-top: 100px;
            border: 2px solid white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }
        .browBox {
            width: 100%;
            height: 200px;
            background: #e6e6e6;
            position: absolute;
            z-index: 100;
            bottom: 0px;
            overflow: scroll;
        }
        .browBox ul {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
        }
        .browBox ul li {
            cursor: pointer;
            width: 10%;
            font-size: 26px;
            list-style: none;
            text-align: center;
        }
        .submit-btn {
            margin: 0 15px 10px 0;
            float: right;
        }
    </style>
</head>
<!--引入相关的文件-->
<script src="../js/vue.js"></script>
<script src="../element-ui/lib/index.js"></script>
<link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
    <el-popover
            placement="bottom"
            title="标题"
            width="500"
            height="700"
            trigger="click"
            v-model="emojiShow"
    >
        <el-button slot="reference">😀</el-button>
        <div class="browBox">
            <ul>
                <li
                        v-for="(item, index) in faceList"
                        :key="index"
                        @click="getBrow(index)"
                >
                    {{ item }}
                </li>
            </ul>
        </div>
    </el-popover>
    <el-button
            class="submit-btn"
            type="primary"
            @click="submitMessage"
            :disabled="content == ''"
    >发送
    </el-button>
    <el-input
            :rows="5"
            type="textarea"
            placeholder="请输入内容"
            @keyup.enter.native="submitMessage"
            v-model="content"
    >
    </el-input>

</div>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                //聊天输入内容
                content: "",
                //表情框是否展示
                emojiShow: false,
                //表情列表
                faceList: [],
                //表情文本
                getBrowString: "",
            }
        },
        created() {
            this.loadEmojis();
        },
        methods: {
            //加载表情，存放到表情列表中
            loadEmojis() {
                fetch('../json/emojis.json')
                    .then(response => response.json())
                    .then(data => {
                        this.faceList = Object.values(data).map(item => item.char);
                    })
                    .catch(error => console.error('Error:', error));
            },
            // 获取用户点击之后的标签 ，存放到输入框内
            getBrow(index) {
                for (let i in this.faceList) {
                    if (index == i) {
                        this.getBrowString = this.faceList[index];
                        this.content += this.getBrowString;
                    }
                }
                this.emojiShow = false;
            },
            submitMessage(){
                alert(this.content);
                console.log(this.content);

            }
        }
    });
</script>
</body>
</html>
