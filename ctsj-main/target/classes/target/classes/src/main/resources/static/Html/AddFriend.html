<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加好友</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #app {
            display: flex;
            flex-direction: column; /* 修改为上下布局 */
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 80%; /* 增大app框的宽度 */
            height: 80vh;
        }
        .add-friend-form {
            margin-bottom: 20px;
        }
        .add-friend-form .search-container {
            display: flex;
            width: 100%;
            margin-bottom: 10px;
        }
        .add-friend-form input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-right: 10px; /* 添加间隙 */
        }
        .add-friend-form .search-button {
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex-basis: 100px; /* 控制按钮宽度 */
        }
        .add-friend-form .add-button {
            padding: 10px 20px;
            background-color: #28a745; /* 修改按钮颜色 */
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .search-results li {
            padding: 10px;
            border: 1px solid #ddd; /* 添加边框 */
            border-radius: 5px; /* 添加圆角 */
            list-style-type: none; /* 移除列表标记 */
            transition: all 0.3s ease; /* 添加过渡效果 */
            margin-bottom: 10px; /* 添加底部外边距 */
        }
        .search-results li:hover {
            background-color: #e6e6e6; /* 鼠标悬停时改变背景颜色 */
        }
        .search-results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            height: 400px; /* 设置一个固定高度 */
            overflow-y: auto; /* 当内容超出高度时出现滚动条 */
        }
    </style>
    <script src="../js/vue.js"></script>
    <script src="../js/axios-0.18.0.js"></script>
</head>
<body>
<div id="app">
    <div class="add-friend-form">
        <h2>添加好友</h2>
        <div class="search-container">
            <input type="text" v-model="query" placeholder="输入用户名或ID">
            <button class="search-button" @click="search">搜索</button>
        </div>
        <button class="add-button" @click="add">添加</button>
    </div>

    <div class="search-results">
        <h2>搜索结果</h2>
        <ul id="results">
            <li v-for="result in friends" :key="result.id" @click="find(result)">
                {{result.username}}
            </li>
        </ul>
    </div>
</div>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                query: '',
                friends: [],
                myname:'',
                myid :0,
                otherid:0,
                othername: ''
            }
        },
        methods: {
            search:function () {
                axios.get("../user/find?values="+this.query).then(response=>{

                    this.friends=response.data;
                });
            },
            find:function (result){
                this.query=result.username;
                // alert(result.username+","+result.userid)
                this.otherid=result.userid;
                this.othername=result.username;
            },
            add:function (){
                alert(this.myid+","+this.myname);
                axios.get("../friend/addfriend",{
                   params:{myid:this.myid,myname:this.myname,otherid:this.otherid,othername:this.othername}
                }).then(response=>{
                    // alert(JSON.stringify(response.data));
                    let math=response.data;
                    if(math==-1){
                        alert("已经添加！！！");
                    }else if(math==0){
                        alert("添加失败！！！");
                    }else{
                        alert("添加成功！！！");
                    }
                })
            }
        },
        mounted(){
            this.myid=localStorage.getItem("myid");
            this.myname=localStorage.getItem("myname");
        }
    });
</script>
</body>
</html>
