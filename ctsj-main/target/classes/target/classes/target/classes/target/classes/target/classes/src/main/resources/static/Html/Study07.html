<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('../image/beijing01.jpg');
      background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #app{
       width: 70%;
        margin-top: 100px;
    }
    .container {
      background-image: url('../image/dong02.gif');
      background-size: contain;
      background-repeat: repeat-x;
      width: 70%;
      margin: auto;
      padding: 20px;
      background-color: #f8f8f8;
      border-radius: 5px;
      box-shadow: 0px 0px 10px #ccc;
    }
    input[type="text"], textarea {
      width: 95%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    input[type="password"], textarea {
        width: 95%;
        padding: 15px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #outputBox{
      height: 200px;
    }
  </style>
</head>
<script src="../js/vue.js"></script>
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
      <div class="container">
          <h1 style="font-family: 华文新魏;color:deeppink">新增单词</h1>
          <input type="text" id="inputBox" placeholder="请输入单词" @change="checkword()" v-model="eword">
          <input type="text" id="inputBox1" placeholder="请输入单词意思" @change=" checkchina()" v-model="echina">
          <input type="password" id="inputBox2" placeholder="请输入管理员密码" @change="checkpassword()" v-model="password">
          <button @click="showOutput()">添加单词</button>
      </div>
</div>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                eword: '',
                echina: '',
                password:''
            }
        },
        methods: {
            showOutput:function (){
                if(this.eword.length<0 ||  this.eword.length<0 || this.password!=6666){
                    if(this.password!=6666){
                        alert("管理员密码错误！！！")
                    }else{
                        alert("添加失败！！！");
                    }
                    this.emput();
                }else{
                    axios.get('../English',{params:{op:"add",eword:this.eword,echina:this.echina}}).then(response => {
                        if(response.data>0){
                            if(response.data==1){
                                alert("添加失败！！！");
                            }else{
                                alert("添加成功！！！");
                            }
                            this.emput();
                        }else {
                            alert('单词已经存在！！！');
                            this.emput();
                        }
                    })
                }
            },
            checkword:function (){
              if(this.eword.length<0){
                  alert("请输入单词！！！");
              }
            },
            checkchina:function (){
                if(this.echina.length<0){
                    alert("请输入单词！！！");
                }
            },
            emput:function (){
                this.eword="";
                this.echina="";
                this.password="";
            }
        }
    });

</script>
</body>
</html>
