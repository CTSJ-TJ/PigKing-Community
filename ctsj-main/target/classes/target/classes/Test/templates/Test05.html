<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Route Map</title>
    <!-- 引入百度地图API -->
    <script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=rXA8iQy9OhoIKkZEjWbO0xJR5c40gDcg"></script>
    <style>
        #Map{
            width: 90%;
            height: 600px;
            border: 2px red solid;
        }
    </style>
</head>
<body>
<!-- 地图容器 -->
<div id="Map"></div>

<!-- JavaScript 代码 -->
<script>
    // 初始化地图
    var map = new BMap.Map("Map");
    map.centerAndZoom(new BMap.Point(112.6807824,26.8842806), 14); // 初始化地图中心点和缩放级别

    // 创建驾车路线实例
    var driving = new BMap.DrivingRoute(map, {
        renderOptions: {
            map: map,
            autoViewport: true
        }
    });

    // 设置起点和终点坐标
    var start = new BMap.Point(112.6807824,26.8842806); // 起点坐标
    var end = new BMap.Point(112.9807824,26.9842806); // 终点坐标

    // 在地图上搜索驾车路线
    driving.search(start, end);

    // 驾车路线搜索完成后的回调函数
    driving.setSearchCompleteCallback(function(){
        var pts = driving.getResults().getPlan(0).getRoute(0).getPath(); // 获取驾车路线的路径点数组

        // 创建折线，并添加到地图上
        var polyline = new BMap.Polyline(pts);
        map.addOverlay(polyline);
    });

</script>
</body>
</html>
