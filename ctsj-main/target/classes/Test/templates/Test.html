<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>获取信息窗口内容</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <script src="//api.map.baidu.com/api?type=webgl&v=2.0&ak=rXA8iQy9OhoIKkZEjWbO0xJR5c40gDcg"></script>
  <style>
    #Map{
      width: 90%;
      height: 600px;
      border: 2px red solid;

    }
  </style>
</head>

<body>
<div id="Map"></div>
</body>

</html>
<script>
  var map = new BMapGL.Map('Map');// 创建Map实例
  var point; // 初始化地图,设置中心点坐标和地图级别
  // 获取用户的当前位置
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      point = new BMapGL.Point(position.coords.longitude, position.coords.latitude);
      map.centerAndZoom(point, 17);//调节比列
    });
  } else {
    point = new BMapGL.Point(116.404, 39.915); // 默认的中心点坐标
    map.centerAndZoom(point, 20);
  }

  var scaleCtrl = new BMapGL.ScaleControl();  // 添加比例尺控件
  map.addControl(scaleCtrl);
  var zoomCtrl = new BMapGL.ZoomControl();  // 添加缩放控件
  map.addControl(zoomCtrl);
  // 创建点标记
  var marker = new BMapGL.Marker(point);
  map.addOverlay(marker);
  // 创建信息窗口
  var opts = {
    width: 200,
    height: 100,
    title: '故宫博物院'
  };
  var infoWindow = new BMapGL.InfoWindow('地址：北京市东城区王府井大街88号乐天银泰百货八层', opts);
  map.openInfoWindow(infoWindow, point); // 开启信息窗口
  function getInfoContent() {
    alert(infoWindow.getContent());
  }
  var map = new AMap.Map('allmap', {
    zoom: 14,
    zoomEnable: true,
    scrollWheel: false,
    center: [113.360435, 23.101970],
    lang: "zh_cn" //可选值：en，zh_en, zh_cn
  });
</script>
