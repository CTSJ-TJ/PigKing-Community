<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #app{
      /*border: 2px red solid;*/
    }
    #inputBox {
      margin-left: 10%;
      width: 80%;
      height: 200px;
      border: 1px solid #000;
      padding: 10px;
      overflow-y: scroll;
      margin-bottom: 10px;
    }
    #contentBox{
      margin-left: 10%;
      width: 80%;
      padding: 10px;
      /*overflow-y: scroll;*/
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 40px;
    }
    #submitButton {
      margin-left: 80%;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      width: 100px;
    }
    #submitButton:hover {
      background-color: #45a049;
    }

  </style>
</head>
<script src="../js/vue.js"></script>
<script src="../js/axios-0.18.0.js"></script>
<body>
<div id="app">
  <div id="title">
    <h1 style="font-family: 微软雅黑;color: #1A8BE8">自动生成摘要</h1>
    <h3 style="margin-left: 10%">请输入一段中文文本：</h3>
  </div>
  <div id="inputBox" contenteditable="true" @input="updateContent"></div>
  <button id="submitButton" @click="submit">生成摘要</button>
  <div v-show="!showstart">
      <h3 style="margin-left: 10%">结果：</h3>
      <div id="contentBox" contenteditable="true">
        {{ content }}
      </div>
  </div>

</div>

<script>
  new Vue({
    el: '#app',
    data() {
      return {
        inputContent: '',
        gauge: null,
        content:'你好呀！！！',
        showstart:true
      }
    },
    mounted() {
    },
    methods: {
      updateContent(e) {
        this.inputContent = e.target.innerText;
      },
      submit() {
        // alert(this.inputContent);
        axios.get("../myai/abstract?texts="+this.inputContent).then(response=>{
            // alert(JSON.stringify(response.data));
            this.content=response.data;
            this.showstart=!this.showstart;
        })

      }
    }
  });
</script>
</body>
</html>
