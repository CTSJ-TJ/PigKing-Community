<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>在线聊天</title>
    <style>
        .container {
            display: flex;
            border: 2px solid lightblue;
            box-shadow: 0px 0px 10px rgba(70,130,180,0.5);
        }
        .friend-list {
            width: 30%;
            height: 500px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }
        .chat-content {
            width: 70%;
            height: 500px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 5px;
            margin-left: 20px;
        }
        .friend-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: #f8f9fa;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }
        .friend-list li {
            padding: 20px;
            border-bottom: 1px solid #ccc;
            font-size: 18px;
            color: #333;
            transition: background-color 0.3s ease;
        }
        .friend-list li:last-child {
            border-bottom: none;
        }
        .friend-list li:hover {
            background-color: #e9ecef;
        }
        .message {
            padding: 10px;
            background-color: #ffffff;
            margin-bottom: 10px;
            border-radius: 5px;
            width: 500px;
            display: flex;
            flex-direction: column;
            /*box-shadow: 0px 0px 10px #ffffff; !* 添加了纯白色的阴影边框 *!*/
        }
        .message img {
            border: 2px red solid;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }
        .message h5 {
            margin: 0;
            font-size: 14px;
            color: #333;
            margin-left: 10px;
            margin-right: 10px;
        }
        .message p {
            border: 2px solid #add8e6; /* 更改边框颜色为淡蓝色 */
            box-shadow: 0 0 10px rgba(0,0,0,0.5); /* 添加阴影效果 */
            border-radius: 10px; /* 使四个角变圆 */
            width: 300px;
            margin: 0;
            font-size: 16px;
            color: black;
            display: inline-block;
            float: right;
            width: 95%;
            line-height: 60px;
            margin-right: 15px;
            margin-left: 15px;
            padding-left: 5px;
            padding-right: 5px;
            font-family: 微软雅黑;
        }
        .message small {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }
        .message-sender-1 {
            background-color: #ffffff;
            /*border-radius: 10px;*/
            padding: 10px;
        }
        .message-sender-2 {
            /*border-radius: 10px;*/
            padding: 10px;
            float: right;
            background-color: #ffffff;
            justify-content: flex-end;
            text-align: right; /* 添加这一行 */
            display: flex; /* 添加这一行 */
            align-items: flex-end; /* 添加这一行 */
        }
        .label {
            width: 95%;
            /*border: red 2px solid;*/
            display: inline-block;
            padding: 5px 10px;
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 30px;
            font-family: 微软雅黑;
        }
        #mytitle{
            margin-bottom: 10px;
            height: 75px;
        }
        #left{
            margin-top: 10px;
            width: 30%;
            float: left;
            display: inline-block;
            border: 2px #ccc solid;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        #right{
            margin-top: 10px;
            width: 68%;
            float: right;
            display: inline-block;
            border: 2px #ccc solid;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        #send{
            margin-top: 5px;
            border: 2px solid white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }
        .browBox {
            width: 100%;
            height: 200px;
            background: #e6e6e6;
            position: absolute;
            z-index: 100;
            bottom: 0px;
            overflow: scroll;
        }
        .browBox ul {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
        }
        .browBox ul li {
            cursor: pointer;
            width: 10%;
            font-size: 26px;
            list-style: none;
            text-align: center;
        }
        .submit-btn {
            margin: 0 15px 10px 0;
            float: right;
        }
    </style>
    <script src="../js/vue.js"></script>
    <script src="../js/axios-0.18.0.js"></script>
    <script src="../element-ui/lib/index.js"></script>
    <link rel="stylesheet" href="../element-ui/lib/theme-chalk/index.css">
    <script src="../js/sockjs.min.js"></script>
    <script src="../js/stomp.js"></script>
</head>
<body>
<div id="app">
    <div id="mytitle">
        <div id="left">
            <div class="label">好友列表</div>
        </div>
        <div id="right">
            <div class="label">社区聊天室</div>
        </div>
    </div>
    <div class="container">
        <div class="friend-list">
            <ul>
                <li v-for="friend in friends" :key="friend.friendid" @click="handleclick(friend.friendid)">
                    {{ friend.friendname }}
                </li>
            </ul>
        </div>
        <div class="chat-content">
            <div v-for="message in messages" :key="message.msgid" class="message" :class="{'message-sender-1': message.senderid == otherid, 'message-sender-2': message.senderid == myid}">
                <h5>{{ message.sendername }}</h5>
                <img src="../image/pengge.jpg"/>
                <p>{{ message.content }}</p>
                <small>{{ message.createtime }}</small>
            </div>
        </div>
    </div>
    <div id="send">
        <el-popover
                placement="bottom"
                title="标题"
                width="500"
                height="700"
                trigger="click"
                v-model="emojiShow"
        >
            <el-button slot="reference">😀</el-button>
            <div class="browBox">
                <ul>
                    <li
                            v-for="(item, index) in faceList"
                            :key="index"
                            @click="getBrow(index)"
                    >
                        {{ item }}
                    </li>
                </ul>
            </div>
        </el-popover>
        <el-button
                class="submit-btn"
                type="primary"
                @click="submitMessage"
                :disabled="content == ''"
        >发送
        </el-button>
        <el-input
                :rows="5"
                type="textarea"
                placeholder="请输入内容"
                @keyup.enter.native="submitMessage"
                v-model="content"
        >
        </el-input>
    </div>
</div>
<script>
    new Vue({
        el: '#app',
        data() {
            return {
                friends: [],
                messages: [],
                myid: 0,
                myname: "猪王",
                otherid: 0,
                content: "",
                emojiShow: false,
                faceList: [],
                getBrowString: "",
                stompClient: null, // 添加这一行
            }
        },
        created() {
            let socket = new SockJS('/websocket');
            this.stompClient = Stomp.over(socket);
            this.stompClient.connect({}, frame => {
                this.stompClient.subscribe('/topic/messages', messageOutput => {
                    console.log("Received: " + messageOutput.body);
                    // 在这里更新你的前端界面
                });
            });
        },
        methods:{
            handleclick(id) {
                this.otherid=id;
                axios.get("../message/chat",{
                    params: {myid: this.myid,otherid:id}
                }).then(response=>{
                    console.log("msg:"+JSON.stringify(response.data));
                    this.messages=response.data;
                });
            },
            findfriend(){
                axios.get("../user/findfriend",{
                    params: {myid: this.myid}
                }).then(response=>{
                    mydata=response.data;
                    //数据前端处理
                    let myId = this.myid;
                    let result = mydata.map(item => {
                        if (item.friendxid == myId) {
                            return { friendid: item.friendyid, friendname: item.friendyname };
                        } else if (item.friendyid == myId) {
                            return { friendid: item.friendxid, friendname: item.friendxname };
                        }
                    }).filter(item => item !== undefined);
                    console.log("hwo:"+(JSON.stringify(result)));
                    this.friends=result;
                });
            },
            //加载表情，存放到表情列表中
            loadEmojis() {
                fetch('../json/emojis.json')
                    .then(response => response.json())
                    .then(data => {
                        this.faceList = Object.values(data).map(item => item.char);
                    })
                    .catch(error => console.error('Error:', error));
            },
            // 获取用户点击之后的标签 ，存放到输入框内
            getBrow(index) {
                for (let i in this.faceList) {
                    if (index == i) {
                        this.getBrowString = this.faceList[index];
                        this.content += this.getBrowString;
                    }
                }
                this.emojiShow = false;
            },
            submitMessage(){
                axios.get("../message/addchat",{
                    params: {content:this.content,senderid: this.myid,
                        sendername: this.myname,receiverid:this.otherid}
                }).then(response=>{
                    console.log("msg:"+response.data);
                    this.handleclick(this.otherid);
                    this.content="";
                    // 发送WebSocket消息
                    this.stompClient.send("/app/chat", {}, JSON.stringify({
                        'from': this.myname,
                        'text': this.content
                    }));

                });
            }
        },
        mounted(){
            this.loadEmojis();
            var myid=localStorage.getItem("myid");
            axios.get("../user/getuser",{params:{myid: myid}}).then(result=>{
                // alert(JSON.stringify(result.data));
                this.myname=result.data.myname;
                this.myid=result.data.myid;
                this.findfriend();
            });
        }
    })
</script>
</body>
</html>
